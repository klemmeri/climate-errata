name: Export discussions for site search
on:
  discussion:
    types: [created, edited, deleted, answered, unanswered, category_changed]
  discussion_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
  discussions: read
concurrency:
  group: export-discussions
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export
        run: python3 tools/export_discussions.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
      - name: Rebuild dataset pages and feeds
        run: python3 tools/build_datasets.py
      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- discussions.json datasets feed.xml)" ]; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add discussions.json datasets feed.xml
          git commit -m "Update discussion index, dataset pages and feeds"
          git pull --rebase origin main
          git push
